name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KONSOLAI_TEST_TIMEOUT_SCALE: "5"
    services:
      postgres:
        image: pgvector/pgvector:pg17-trixie@sha256:7a7e9f22015b67edb4bef5c59daeebcd7e74bfa570df6ce60ae01237c8648a84
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ktest
          POSTGRES_DB: konsolai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d konsolai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install PDF tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
          chrome=""
          if [ -x /usr/bin/google-chrome ]; then
            chrome=/usr/bin/google-chrome
          elif [ -x /usr/bin/google-chrome-stable ]; then
            chrome=/usr/bin/google-chrome-stable
          elif [ -x /usr/bin/chromium ]; then
            chrome=/usr/bin/chromium
          elif [ -x /usr/bin/chromium-browser ]; then
            chrome=/usr/bin/chromium-browser
          else
            sudo apt-get install -y --no-install-recommends chromium
            chrome=/usr/bin/chromium
          fi
          echo "KONSOLAI_CHROME=${chrome}" >> "$GITHUB_ENV"

      - name: Check gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          KONSOLAI_TEST_DATABASE_URL: postgres://postgres:ktest@localhost:5432/konsolai_test?sslmode=disable
        run: go test ./... -count=1 -timeout 45m
